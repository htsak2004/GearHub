<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#cardShadow)">
    <!-- Clipboard Board -->
    <rect x="25" y="20" width="130" height="165" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Top Clip -->
    <rect x="65" y="10" width="50" height="20" rx="6" fill="#64748b"/>
    <circle cx="90" cy="18" r="4" fill="#ffffff"/>

    <!-- Paper Card -->
    <rect x="35" y="32" width="110" height="142" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Avatar Placeholder -->
    <rect x="48" y="46" width="34" height="34" rx="8" fill="#dbeafe"/>
    <!-- Head and Shoulder -->
    <circle cx="65" cy="58" r="7" fill="#3b82f6"/>
    <path d="M53 76 C53 69, 77 69, 77 76 Z" fill="#3b82f6"/>

    <!-- Text Lines Placeholder -->
    <rect x="90" y="50" width="44" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="90" y="62" width="32" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="90" y="72" width="38" height="5" rx="2.5" fill="#e2e8f0"/>

    <rect x="48" y="96" width="84" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="48" y="108" width="76" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="48" y="120" width="60" height="5" rx="2.5" fill="#e2e8f0"/>

    <!-- Big Green Verified Badge Circle bottom right -->
    <circle cx="132" cy="150" r="22" fill="#22c55e" stroke="#ffffff" stroke-width="3"/>
    <path d="M123 150 L129 156 L141 144" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
