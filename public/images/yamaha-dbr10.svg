<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" fill="none">
  <defs>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mixerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowPA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="285" rx="150" ry="14" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#shadowPA)">
    <!-- Speaker 1 (Left) -->
    <rect x="50" y="80" width="95" height="190" rx="10" fill="url(#speakerGrad)"/>
    <rect x="58" y="90" width="79" height="170" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- Speaker Grille circles -->
    <circle cx="97" cy="130" r="24" fill="#09090b" stroke="#27272a" stroke-width="2"/>
    <circle cx="97" cy="205" r="38" fill="#09090b" stroke="#27272a" stroke-width="3"/>
    <!-- Yamaha Logo badge -->
    <rect x="85" y="248" width="24" height="7" rx="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Speaker 2 (Right) -->
    <rect x="255" y="80" width="95" height="190" rx="10" fill="url(#speakerGrad)"/>
    <rect x="263" y="90" width="79" height="170" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="302" cy="130" r="24" fill="#09090b" stroke="#27272a" stroke-width="2"/>
    <circle cx="302" cy="205" r="38" fill="#09090b" stroke="#27272a" stroke-width="3"/>
    <rect x="290" y="248" width="24" height="7" rx="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Center Audio Mixer Console -->
    <rect x="155" y="145" width="90" height="125" rx="8" fill="url(#mixerGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Mixer Channel Strips -->
    <rect x="163" y="155" width="14" height="85" rx="3" fill="#0f172a"/>
    <rect x="181" y="155" width="14" height="85" rx="3" fill="#0f172a"/>
    <rect x="199" y="155" width="14" height="85" rx="3" fill="#0f172a"/>
    <rect x="223" y="155" width="14" height="85" rx="3" fill="#0f172a"/>

    <!-- Colored EQ Knobs -->
    <circle cx="170" cy="165" r="4" fill="#ef4444"/>
    <circle cx="170" cy="180" r="4" fill="#3b82f6"/>
    <circle cx="170" cy="195" r="4" fill="#22c55e"/>

    <circle cx="188" cy="165" r="4" fill="#ef4444"/>
    <circle cx="188" cy="180" r="4" fill="#3b82f6"/>
    <circle cx="188" cy="195" r="4" fill="#22c55e"/>

    <circle cx="206" cy="165" r="4" fill="#ef4444"/>
    <circle cx="206" cy="180" r="4" fill="#3b82f6"/>
    <circle cx="206" cy="195" r="4" fill="#22c55e"/>

    <!-- Master Faders -->
    <rect x="168" y="215" width="4" height="20" rx="1" fill="#475569"/>
    <rect x="165" y="222" width="10" height="6" rx="1" fill="#ffffff"/>

    <rect x="186" y="215" width="4" height="20" rx="1" fill="#475569"/>
    <rect x="183" y="220" width="10" height="6" rx="1" fill="#ffffff"/>

    <rect x="204" y="215" width="4" height="20" rx="1" fill="#475569"/>
    <rect x="201" y="225" width="10" height="6" rx="1" fill="#ffffff"/>

    <!-- Master Volume Knob (Red) -->
    <circle cx="230" cy="225" r="7" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="230" y1="225" x2="234" y2="220" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
