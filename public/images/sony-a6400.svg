<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" fill="none">
  <defs>
    <radialGradient id="sonyLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="sonyBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="shadowSony" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Shadow underneath -->
  <ellipse cx="200" cy="285" rx="140" ry="14" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#shadowSony)">
    <!-- Camera Body -->
    <rect x="75" y="105" width="250" height="155" rx="12" fill="url(#sonyBody)"/>
    
    <!-- Grip on Right Side -->
    <path d="M75 120 C75 105, 115 105, 115 130 V245 C115 260, 75 260, 75 245 Z" fill="#111827"/>
    <rect x="80" y="125" width="28" height="120" rx="4" fill="#1f2937" opacity="0.4"/>

    <!-- Viewfinder / Flash hump -->
    <rect x="100" y="88" width="55" height="18" rx="4" fill="#1a202c"/>
    <rect x="105" y="92" width="20" height="10" rx="2" fill="#0f172a"/>

    <!-- Mode Dial & Buttons on top right -->
    <rect x="250" y="92" width="30" height="14" rx="3" fill="#374151"/>
    <rect x="288" y="94" width="24" height="12" rx="3" fill="#4b5563"/>
    <!-- Shutter button -->
    <circle cx="102" cy="112" r="7" fill="#9ca3af"/>
    <circle cx="102" cy="112" r="4" fill="#d1d5db"/>

    <!-- Lens Mount Outer Ring -->
    <circle cx="215" cy="180" r="68" fill="#111827" stroke="#475569" stroke-width="2"/>
    <!-- Sony Alpha Signature Orange Ring -->
    <circle cx="215" cy="180" r="64" stroke="#ea580c" stroke-width="2.5" fill="none"/>
    <!-- Lens Barrel -->
    <circle cx="215" cy="180" r="56" fill="url(#sonyLens)"/>
    <circle cx="215" cy="180" r="44" fill="#020617" stroke="#1e293b" stroke-width="4"/>
    <circle cx="215" cy="180" r="28" fill="#090d16"/>
    <!-- Lens Glass Reflection -->
    <path d="M195 160 C210 150, 235 155, 240 170" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <circle cx="202" cy="168" r="4" fill="#ffffff" opacity="0.8"/>

    <!-- Brand Label -->
    <text x="175" y="122" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1">SONY</text>
    <text x="280" y="122" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="700">α6400</text>
  </g>
</svg>
