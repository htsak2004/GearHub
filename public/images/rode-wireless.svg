<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" fill="none">
  <defs>
    <linearGradient id="rodeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <filter id="shadowRode" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="145" cy="270" rx="65" ry="12" fill="#cbd5e1" opacity="0.6"/>
  <ellipse cx="265" cy="275" rx="65" ry="12" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#shadowRode)">
    <!-- Unit 1: Transmitter (Left) -->
    <rect x="90" y="105" width="110" height="150" rx="18" fill="url(#rodeBody)"/>
    <!-- Mic capsule mesh grill top -->
    <rect x="105" y="93" width="30" height="15" rx="6" fill="#171717" stroke="#404040" stroke-width="1.5"/>
    <circle cx="112" cy="100" r="1.5" fill="#737373"/>
    <circle cx="120" cy="100" r="1.5" fill="#737373"/>
    <circle cx="128" cy="100" r="1.5" fill="#737373"/>
    <!-- LED Indicators -->
    <circle cx="180" cy="120" r="3" fill="#22c55e"/>
    <circle cx="190" cy="120" r="3" fill="#3b82f6"/>
    <!-- RODE Logo Text -->
    <text x="145" y="185" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="2" text-anchor="middle">RØDE</text>
    <text x="145" y="202" fill="#a3a3a3" font-family="sans-serif" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">WIRELESS GO</text>
    <!-- Gold Dot Accent -->
    <circle cx="182" cy="170" r="3" fill="#eab308"/>

    <!-- Unit 2: Receiver (Right, slightly forward) -->
    <rect x="210" y="115" width="110" height="150" rx="18" fill="url(#rodeBody)"/>
    <!-- LCD Screen -->
    <rect x="225" y="130" width="80" height="70" rx="8" fill="#000000" stroke="#262626" stroke-width="2"/>
    <!-- Audio Waveform Graphic on screen -->
    <path d="M235 165 L240 150 L245 175 L250 145 L255 180 L260 160 L265 170 L270 155 L275 165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <rect x="235" y="180" width="28" height="4" rx="2" fill="#22c55e"/>
    <rect x="270" y="180" width="28" height="4" rx="2" fill="#22c55e"/>
    <!-- Battery icons -->
    <rect x="285" y="138" width="12" height="6" rx="1.5" fill="#22c55e"/>
    <!-- RODE Logo on Receiver -->
    <text x="265" y="235" fill="#f5f5f5" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="2" text-anchor="middle">RØDE</text>
    <circle cx="295" cy="225" r="2.5" fill="#eab308"/>
  </g>
</svg>
